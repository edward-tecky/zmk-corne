name: Validate firmware security boundaries

on:
  workflow_dispatch:
    inputs:
      export_approved_artifacts:
        description: "Export artifacts from the exact user-approved source"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/build-user-config-pinned.yml"
      - ".github/workflows/security-firmware-boundaries.yml"
      - "boards/**"
      - "config/**"
      - "security/build-firmware-boundaries.yaml"

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-user-config-pinned.yml
    with:
      build_matrix_path: security/build-firmware-boundaries.yaml
      archive_name: approved-firmware-72e4df5
      source_ref: ${{ inputs.export_approved_artifacts && '72e4df5041a6ac7380385ddcd38cb858d7f4c340' || github.sha }}
      upload_artifacts: ${{ inputs.export_approved_artifacts }}
